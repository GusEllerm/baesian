name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # baesian verify needs the base and every commit in the range
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service/package-lock.json
      - run: npm ci
      # The relay's packages first (B-v5pde): the root suite runs the CLI against the relay, started locally in workerd
      # from the service's own Wrangler (M9d, test/relay.test.ts); without them, those tests are skipped.
      - run: npm ci --prefix service
      - run: npm run typecheck
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build

      # The relay (M9b): its own package, typechecked and tested in workerd, Cloudflare's runtime (B-hx2fn). Nothing
      # deploys from here, and no Cloudflare account is needed.
      - run: npm run test:service
        env:
          WRANGLER_SEND_METRICS: "false"

      # The commit gate, again, for every pushed commit: catches --no-verify and machines without the
      # hooks (D24). This repo runs its own build, so each commit is checked by the Baesian it builds, where other repos
      # run the release from npm that `baesian ci` pinned (B-c0e0d). The repo is linked to the hosted
      # service, so answers count only with the service's signature, checked against the keys pinned in the repo
      # variable BAESIAN_TRUST, outside the repo, where a commit can't change them (D142, D159).
      - name: baesian verify (pushed commits)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node dist/bin.js verify --base "${{ github.event.before }}"
        env:
          BAESIAN_TRUST: ${{ vars.BAESIAN_TRUST }}

      # Pull requests also get the merge gate: every cited card resolved or deferred (D31).
      - name: baesian verify --merge (pull request)
        if: github.event_name == 'pull_request'
        run: node dist/bin.js verify --merge
        env:
          BAESIAN_TRUST: ${{ vars.BAESIAN_TRUST }}
