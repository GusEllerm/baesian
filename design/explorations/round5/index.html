<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baesian: round 5 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <span class="wordmark">Baesian</span><span class="dry-tag" id="dry-tag" hidden>Dry run: real decisions, answers saved</span>
  <p class="summary" id="summary" aria-live="polite"></p>
  <div class="menu-wrap" style="margin-left:auto">
    <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="More">More</button>
    <div class="menu" id="menu" role="menu" hidden>
      <button role="menuitemcheckbox" id="practice" aria-checked="false">Practice cards</button>
      <button role="menuitem" id="calib">Your calibration</button>
      <button role="menuitem" id="keys-btn">Keyboard shortcuts <kbd>?</kbd></button>
    </div>
  </div>
</header>

<main class="desk">
  <svg class="path-lines" id="path-lines" aria-hidden="true"></svg>
  <aside class="hood" id="hood" aria-label="Your path through the decisions, and what this one is connected to"></aside>
  <section class="stage" id="stage" aria-label="The card to answer">
    <p class="crumbs" id="crumbs"></p>
    <div class="deck" id="deck">
      <div class="pile" id="pile" aria-hidden="true"></div>
      <article class="card" id="card" tabindex="-1"></article>
    </div>
    <p class="pile-count" id="pile-count"></p>
    <div class="empty" id="empty">
      <p class="big">All caught up.</p>
      <p id="empty-recap"></p>
      <button id="again">Start the prototype again</button>
    </div>
  </section>
</main>


<div class="toast" id="toast" role="status"></div>
<aside class="panel mirror" id="mirror" aria-label="Your calibration"></aside>
<aside class="panel keys" id="keys" aria-label="Keyboard shortcuts"></aside>

<script type="module" src="app.js"></script>
</body>
</html>
