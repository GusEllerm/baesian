<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baesian · the drum, A: a real reel</title>
<link rel="stylesheet" href="reel.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar">
  <span class="wordmark">Baesian</span>
  <p class="summary" id="summary" aria-live="polite"></p>
  <p class="keys"><kbd>←</kbd> <kbd>→</kbd> choose, the same key again to confirm · <kbd>Z</kbd> undo · <kbd>S</kbd> sound <span id="sound">off</span></p>
</header>
<main class="desk" id="desk">
  <section class="reel" id="reel" aria-label="Your path: answered above, coming next below">
    <div class="cast" id="cast" aria-hidden="true"></div>
    <div class="scene" id="scene" aria-hidden="true"><div class="drum" id="drum"></div></div>
    <svg class="over" id="over" aria-hidden="true"></svg>
    <ol class="sr" id="sr"></ol>
  </section>
  <section class="stage" id="stage" aria-label="The card to answer"></section>
</main>
<div class="toast" id="toast" hidden></div>
</body>
</html>
