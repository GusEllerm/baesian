<!doctype html>
<!-- The README's figure of decisions on branches. `npm run readme-media -- figures` renders it to branches.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Alegreya"; src: url(../../node_modules/@fontsource-variable/alegreya/files/alegreya-latin-wght-normal.woff2) format("woff2"); font-weight: 400 900; }
body { margin: 0; }
figure { margin: 0; width: 1200px; height: 540px; background: radial-gradient(120% 90% at 50% 0%, #d9d0da 0%, #cbc0cd 100%); }
svg { display: block; }
.lane { fill: none; stroke-width: 3; stroke-linecap: round; }
.main { stroke: #2e2343; }
.checkout { stroke: #8e3a5f; }
.catalog { stroke: #2c3da6; }
.held { stroke-dasharray: 2 7; }
.commit { fill: #f7eed3; stroke-width: 2.5; }
.branch-name { font: 700 14px "Archivo", sans-serif; fill: #2e2343; }
.branch-who { font: 500 13px "Archivo", sans-serif; fill: #5a4d6e; }
.commit-name { font: 600 12.5px "Archivo", sans-serif; fill: #2e2343; }
.trailer { font: 11.5px "SF Mono", Menlo, monospace; fill: #5a4d6e; }
.chip { fill: #f7eed3; stroke: #d9c68e; stroke-width: 1.5; }
.chip-title { font: 700 15.5px "Alegreya", serif; fill: #2e2343; }
.chose { font: 600 12px "Archivo", sans-serif; fill: #3f8f5a; }
.stopped { font: 600 12px "Archivo", sans-serif; fill: #8e3a5f; }
.thread { fill: none; stroke: #8c809b; stroke-width: 1.4; stroke-dasharray: 3 4; }
.gate { stroke-width: 1.5; }
.gate-ok { fill: #e3efe4; stroke: #3f8f5a; }
.gate-held { fill: #f3e2ea; stroke: #8e3a5f; }
.gate-text { font: 600 12.5px "Archivo", sans-serif; }
.note { font: 400 15px "Alegreya", serif; fill: #5a4d6e; }
</style>
</head>
<body>
<figure>
<svg width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Two branches off main. On feat/checkout, claude-code's two cards are answered and the commits that build on them cite them; the branch merges. On feat/catalog, codex has stopped on a card that's still waiting, so its merge is held.">
  <defs>
    <path id="crown" d="M -6.8 4.7 L -6.8 -2.6 L -3.1 0.5 L 0 -5.7 L 3.1 0.5 L 6.8 -2.6 L 6.8 4.7 Z" />
    <path id="star" d="M 0 -6.76 L 1.68 -2.31 L 6.43 -2.09 L 2.72 0.88 L 3.97 5.47 L 0 2.86 L -3.97 5.47 L -2.72 0.88 L -6.43 -2.09 L -1.68 -2.31 Z" />
    <path id="diamond" d="M 0 -6.5 L 5.7 0 L 0 6.5 L -5.7 0 Z" />
    <g id="tick"><circle cx="5" cy="4.6" r="3.6" fill="#3f8f5a" /><path d="M3.3 4.7 L4.6 6 L6.8 3.4" stroke="#fff" stroke-width="1.2" fill="none" /></g>
  </defs>

  <!-- main -->
  <path class="lane main" d="M 40 280 H 1160" />
  <text class="branch-name" x="40" y="262">main</text>

  <!-- feat/checkout: claude-code's branch, merged -->
  <path class="lane checkout" d="M 110 280 C 150 280, 150 140, 190 140 H 860 C 900 140, 900 280, 940 280" />
  <text x="196" y="122"><tspan class="branch-name">feat/checkout</tspan><tspan class="branch-who" dx="6">claude-code</tspan></text>

  <!-- its cards, above the branch -->
  <g transform="translate(395 32)">
    <rect class="chip" width="250" height="56" rx="9" />
    <g transform="translate(20 28) scale(1.15)"><use href="#crown" fill="#f3d58a" stroke="#6E1F2E" stroke-width="1.4" /><use href="#tick" /></g>
    <text class="chip-title" x="40" y="24">Where the session lives</text>
    <text class="chose" x="40" y="43">you chose “An HttpOnly cookie”</text>
  </g>
  <g transform="translate(655 32)">
    <rect class="chip" width="285" height="56" rx="9" />
    <g transform="translate(20 28) scale(1.15)"><use href="#crown" fill="#f3d58a" stroke="#6E1F2E" stroke-width="1.4" /><use href="#tick" /></g>
    <text class="chip-title" x="40" y="24">What deleting an account removes</text>
    <text class="chose" x="40" y="43">you chose “Erase it at once”</text>
  </g>
  <path class="thread" d="M 520 132 V 90" />
  <path class="thread" d="M 770 132 V 90" />

  <!-- its commits -->
  <circle class="commit" cx="280" cy="140" r="7" stroke="#8e3a5f" />
  <text class="commit-name" x="280" y="166" text-anchor="middle">Sign-in endpoint</text>
  <circle class="commit" cx="520" cy="140" r="7" stroke="#8e3a5f" />
  <text class="commit-name" x="520" y="166" text-anchor="middle">Session cookie</text>
  <text class="trailer" x="520" y="183" text-anchor="middle">Baesian-Card: B-4h2mx</text>
  <circle class="commit" cx="770" cy="140" r="7" stroke="#8e3a5f" />
  <text class="commit-name" x="770" y="166" text-anchor="middle">Delete my account</text>
  <text class="trailer" x="770" y="183" text-anchor="middle">Baesian-Card: B-9wq3t</text>

  <!-- feat/catalog: codex's branch, held -->
  <path class="lane catalog" d="M 110 280 C 150 280, 150 410, 190 410 H 1020" />
  <path class="lane catalog held" d="M 1020 410 C 1060 410, 1060 280, 1100 280" />
  <text x="196" y="392"><tspan class="branch-name">feat/catalog</tspan><tspan class="branch-who" dx="6">codex</tspan></text>

  <circle class="commit" cx="400" cy="410" r="7" stroke="#2c3da6" />
  <text class="commit-name" x="400" y="378" text-anchor="middle">Kitchen screen</text>
  <text class="trailer" x="400" y="361" text-anchor="middle">Baesian-Card: B-k8n2d</text>

  <g transform="translate(275 452)">
    <rect class="chip" width="250" height="56" rx="9" />
    <g transform="translate(20 28) scale(1.15)"><use href="#diamond" fill="#F0E4BE" stroke="#6d7482" stroke-width="1.4" /><use href="#tick" /></g>
    <text class="chip-title" x="40" y="24">How orders reach the kitchen</text>
    <text class="chose" x="40" y="43">you chose “Server-sent events”</text>
  </g>
  <path class="thread" d="M 400 418 V 452" />

  <g transform="translate(600 452)">
    <rect class="chip" width="250" height="56" rx="9" />
    <g transform="translate(20 28) scale(1.15)"><use href="#star" fill="#f6e3a4" stroke="#B8860B" stroke-width="1.4" /><circle cx="5.2" cy="-4.8" r="3.3" fill="#8E3A5F" stroke="#F0E4BE" stroke-width="1" /></g>
    <text class="chip-title" x="40" y="24">How prices are stored</text>
    <text class="stopped" x="40" y="43">codex has stopped: waiting for you</text>
  </g>
  <path class="thread" d="M 725 418 V 452" />
  <circle cx="725" cy="410" r="6" fill="#8E3A5F" stroke="#f7eed3" stroke-width="2" />

  <!-- the merge gate -->
  <circle class="commit" cx="940" cy="280" r="7" stroke="#2e2343" />
  <g transform="translate(790 298)">
    <rect class="gate gate-ok" width="230" height="30" rx="15" />
    <text class="gate-text" x="115" y="20" text-anchor="middle" fill="#2f6e44">Merges: every card answered</text>
  </g>
  <circle cx="1062" cy="345" r="9" fill="#8E3A5F" stroke="#f7eed3" stroke-width="2" />
  <path d="M 1057 345 H 1067" stroke="#f7eed3" stroke-width="2.2" stroke-linecap="round" />
  <g transform="translate(895 430)">
    <rect class="gate gate-held" width="270" height="30" rx="15" />
    <text class="gate-text" x="135" y="20" text-anchor="middle" fill="#6E1F2E">Merge held: a card is still waiting</text>
  </g>
  <text class="note" x="40" y="470">The decisions are committed</text>
  <text class="note" x="40" y="489">with the branch, so they</text>
  <text class="note" x="40" y="508">merge with the code.</text>
</svg>
</figure>
</body>
</html>
