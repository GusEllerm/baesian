<!doctype html>
<!-- The README's figure of commits as checkpoints. `npm run readme-media -- figures` renders it to checkpoints.png, framed.
     It's drawn 880 px wide, so GitHub shows it at about its own size: its smallest type, 13 px, stays 13 px there.
     The lane, the commits and the arcs are the SVG; every word is HTML, and spans the box it sits in (B-5s5h2). -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2-variations"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Alegreya"; src: url(../../node_modules/@fontsource-variable/alegreya/files/alegreya-latin-wght-normal.woff2) format("woff2"); font-weight: 400 900; }
:root { --ink: #2e2343; --soft: #5a4d6e; --faint: #6f6382; --rose: #8e3a5f; --face: #f7eed3; --line: #d9c68e; --ok: #3f8f5a; --mono: "SF Mono", Menlo, monospace; }
* { box-sizing: border-box; }
body { margin: 0; }
figure { position: relative; margin: 0; width: 880px; height: 532px; background: radial-gradient(120% 90% at 50% 0%, #d9d0da 0%, #cbc0cd 100%); color: var(--ink); }
svg { position: absolute; inset: 0; }
.lane { fill: none; stroke: var(--rose); stroke-width: 3; stroke-linecap: round; }
.commit { fill: var(--face); stroke: var(--rose); stroke-width: 2.5; }
.stem { stroke: #8c809b; stroke-width: 1.4; stroke-dasharray: 3 4; }
.arc { fill: none; stroke: var(--rose); stroke-width: 1.8; stroke-dasharray: 5 5; }

.branch { position: absolute; left: 32px; top: 104px; font: 700 16px/20px "Archivo"; font-stretch: 90%; }
.branch span { margin-left: 6px; font-weight: 500; color: var(--soft); }
.arc-label { position: absolute; left: 330px; top: 22px; font: 650 14px/18px "Archivo"; font-stretch: 90%; color: var(--rose); }

/* Later, the answer changes: what the agent built on before is named. */
.chip { position: absolute; left: 600px; top: 22px; width: 248px; display: grid; grid-template-columns: 22px 1fr; column-gap: 10px; padding: 11px 14px 12px 14px; background: var(--face); border: 1.8px solid var(--rose); border-radius: 10px; }
.chip svg { position: static; margin-top: 3px; }
.chip b { display: block; font: 700 17px/21px "Alegreya"; }
.chip span { display: block; font: 600 13.5px/18px "Archivo"; font-stretch: 90%; color: var(--rose); }

/* Each commit, and the record it carries: four columns, 204 px each. */
.col { position: absolute; top: 158px; width: 204px; display: flex; flex-direction: column; align-items: center; }
.name { font: 650 15px/20px "Archivo"; font-stretch: 90%; }
.mono { font: 13px/18px var(--mono); color: var(--soft); }
.record { position: absolute; top: 76px; left: 4px; width: 196px; height: 92px; padding: 10px 12px; background: var(--face); border: 1.5px solid var(--line); border-radius: 9px; }
.record h4 { margin: 0 0 6px; font: 600 13px/17px "Archivo"; font-stretch: 90%; color: var(--faint); }
.row { display: flex; align-items: center; gap: 7px; font: 500 15px/22px "Alegreya"; }
.row.wait { color: var(--rose); }
.row i { flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%; background: var(--rose); }
.row.ok i { background: var(--ok); position: relative; }
.row.ok i::after { content: ""; position: absolute; left: 3.4px; top: 2px; width: 3px; height: 5.4px; border: solid #fff; border-width: 0 1.4px 1.4px 0; transform: rotate(40deg); }

/* What the agent hears: the terminal, as wide as the lane. */
.term { position: absolute; left: 32px; top: 354px; width: 816px; padding: 16px 22px 18px; background: var(--ink); border-radius: 10px; font: 14px/21px var(--mono); color: #f0e4be; }
.term p { margin: 0; }
.term p + p { margin-top: 9px; }
.term .dim { color: #a99cbb; }
</style>
</head>
<body>
<figure role="img" aria-label="Four commits on feat/checkout, each carrying the decisions as they stood. Later the answer on the session card changes, and the agent is told which commits built on the old answer.">
  <svg width="880" height="532" viewBox="0 0 880 532" aria-hidden="true">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e3a5f" /></marker>
    </defs>
    <path class="lane" d="M 32 142 H 848" />
    <path class="arc" d="M 598 48 C 520 30, 380 34, 342 128" marker-end="url(#head)" />
    <path class="arc" d="M 598 76 C 572 82, 552 100, 545 128" marker-end="url(#head)" />
    <circle class="commit" cx="134" cy="142" r="7" />
    <circle class="commit" cx="338" cy="142" r="7" />
    <circle class="commit" cx="542" cy="142" r="7" />
    <circle class="commit" cx="746" cy="142" r="7" />
    <path class="stem" d="M 134 216 V 232 M 338 216 V 232 M 542 216 V 232 M 746 216 V 232" />
  </svg>

  <div class="branch">feat/checkout<span>claude-code</span></div>
  <div class="arc-label">built on the old answer</div>
  <div class="chip">
    <svg width="22" height="16" viewBox="-8 -7 16 13" aria-hidden="true"><path d="M -6.8 4.7 L -6.8 -2.6 L -3.1 0.5 L 0 -5.7 L 3.1 0.5 L 6.8 -2.6 L 6.8 4.7 Z" fill="#f3d58a" stroke="#6e1f2e" stroke-width="1.3" /></svg>
    <div><b>Later: the session</b><span>you change your answer to</span><span>“A token in localStorage”</span></div>
  </div>

  <div class="col" style="left: 32px">
    <div class="name">Sign-in endpoint</div>
    <div class="mono">a41e7b0</div>
    <div class="record"><h4>.baesian/ in this commit</h4><div class="row wait"><i></i>Session: waiting</div></div>
  </div>
  <div class="col" style="left: 236px">
    <div class="name">Session cookie</div>
    <div class="mono">3f9c2a1</div>
    <div class="mono">Baesian-Card: B-4h2mx</div>
    <div class="record"><h4>.baesian/ in this commit</h4><div class="row ok"><i></i>Session: cookie</div></div>
  </div>
  <div class="col" style="left: 440px">
    <div class="name">CSRF tokens on forms</div>
    <div class="mono">8b07d4e</div>
    <div class="mono">Baesian-Card: B-4h2mx</div>
    <div class="record"><h4>.baesian/ in this commit</h4><div class="row ok"><i></i>Session: cookie</div><div class="row wait"><i></i>Deleting: waiting</div></div>
  </div>
  <div class="col" style="left: 644px">
    <div class="name">Delete my account</div>
    <div class="mono">c52d19f</div>
    <div class="mono">Baesian-Card: B-9wq3t</div>
    <div class="record"><h4>.baesian/ in this commit</h4><div class="row ok"><i></i>Session: cookie</div><div class="row ok"><i></i>Deleting: erase at once</div></div>
  </div>

  <div class="term">
    <p class="dim">claude-code, at its next stopping point:</p>
    <p>The answer on B-4h2mx changed: it was "An HttpOnly cookie", and now it's "A token in localStorage".</p>
    <p>Commits that cite B-4h2mx, built on the old answer: 3f9c2a1 (feat/checkout), 8b07d4e (feat/checkout). Rework them to match.</p>
  </div>
</figure>
</body>
</html>
